version: "2"

linters:
  default: none
  enable:
    - revive
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocyclo
    - goconst
    - misspell
    - unconvert
    - unparam
    - nakedret
    - bodyclose
    - errorlint
    - copyloopvar
    - noctx
    - gosec
    - gocritic
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: package-comments
          disabled: true
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
      
      
